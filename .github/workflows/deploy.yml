name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # WordPress plugin files are not part of the Astro build
    paths-ignore: ['wordpress/**', 'README.md']
  workflow_dispatch:
  # Sent by WordPress when content changes
  repository_dispatch:
    types: [cms-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CMS_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
