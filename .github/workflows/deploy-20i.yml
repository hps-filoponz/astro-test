name: Deploy to 20i

on:
  push:
    branches: [main]
    # WordPress plugin files are not part of the Astro build
    paths-ignore: ['wordpress/**', 'docs/**', 'README.md']
  workflow_dispatch:
  # Sent by WordPress when content changes
  repository_dispatch:
    types: [cms-update]

concurrency:
  group: deploy-20i
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: 20i
      CMS_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Uploads only changed files after the first run.
      # Needs FTP_HOST, FTP_USERNAME and FTP_PASSWORD repository secrets.
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./public_html/
