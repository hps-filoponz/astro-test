name: Inspect CMS (temporary)
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://cms-astrotest-com.stackstaging.com
          echo "== root"; curl -sS -o /dev/null -w "%{http_code}\n" "$B/wp-json/"
          echo "== types"; curl -sS "$B/wp-json/wp/v2/types" | jq -c 'to_entries[] | {k:.key, rest:.value.rest_base}'
          echo "== coffee"; curl -sS "$B/wp-json/wp/v2/coffee?per_page=20&_embed" | jq '.' | head -c 6000
